name: Escaneo diario de propiedades

on:
  schedule:
    # 17:00 hora Argentina (UTC-3, sin horario de verano) = 20:00 UTC
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "No mandar mails, sólo mostrar en los logs qué matchearía (recomendado para probar)"
        type: boolean
        default: true
      debug_source:
        description: "Opcional: nombre de una fuente (ej: mercadolibre) para inspeccionar sus datos crudos en vez de correr el scan normal"
        type: string
        default: ""
      debug_raw_keys:
        description: "Junto con debug_source: también mostrar las claves del dato crudo del primer aviso"
        type: boolean
        default: false
      probe_sites:
        description: "Sonda rápida: GET simple (o navegador, con probe_browser) a la home de cada sitio"
        type: boolean
        default: false
      probe_browser:
        description: "Junto con probe_sites: usar Chromium real en vez de un GET simple"
        type: boolean
        default: false
      fetch_url:
        description: "Opcional: URL puntual para inspeccionar su HTML crudo (para desarrollar un conector nuevo)"
        type: string
        default: ""
      fetch_grep:
        description: "Opcional, junto con fetch_url: sólo mostrar líneas que contengan este texto"
        type: string
        default: ""
      fetch_browser:
        description: "Junto con fetch_url: usar Chromium real en vez de un GET simple"
        type: boolean
        default: false
      fetch_wait_selector:
        description: "Junto con fetch_url + fetch_browser: esperar a que aparezca este selector CSS"
        type: string
        default: ""

permissions:
  contents: write

# Corre en TU computadora (self-hosted runner), no en la nube de GitHub —
# varios de los portales bloquean las IPs de datacenter de GitHub Actions
# pero no una IP residencial normal. Ver docs/DESPLIEGUE.md para cómo
# registrar tu máquina como runner. Si tu compu está apagada a las 17hs, la
# corrida queda en cola y se dispara sola apenas la prendas/conectes — no
# se pierde.
jobs:
  scan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -e .

      - name: Instalar Chromium (Playwright)
        # Sin --with-deps: esa flag instala paquetes del sistema vía apt y
        # sólo tiene sentido en Linux corrido como root/con sudo — no
        # aplica en Windows/Mac, y en un self-hosted runner no conviene
        # correr instalaciones de sistema en cada job. Si tu runner es
        # Linux y falla por librerías faltantes, corré una vez a mano:
        # sudo python -m playwright install-deps chromium
        run: python -m playwright install chromium

      - name: Correr el scan (o alguna herramienta de diagnóstico)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEBUG_SOURCE: ${{ inputs.debug_source }}
          DEBUG_RAW_KEYS: ${{ inputs.debug_raw_keys }}
          PROBE_SITES: ${{ inputs.probe_sites }}
          PROBE_BROWSER: ${{ inputs.probe_browser }}
          FETCH_URL: ${{ inputs.fetch_url }}
          FETCH_GREP: ${{ inputs.fetch_grep }}
          FETCH_BROWSER: ${{ inputs.fetch_browser }}
          FETCH_WAIT_SELECTOR: ${{ inputs.fetch_wait_selector }}
        run: |
          if [ -n "$FETCH_URL" ]; then
            echo "== Modo fetch-url: $FETCH_URL (no se manda mail) =="
            ARGS=(fetch-url "$FETCH_URL" --grep "$FETCH_GREP")
            if [ "$FETCH_BROWSER" = "true" ]; then
              ARGS+=(--browser --wait-selector "$FETCH_WAIT_SELECTOR")
            fi
            python -m realestate.cli "${ARGS[@]}"
          elif [ "$PROBE_SITES" = "true" ]; then
            echo "== Modo probe-sites (no se manda mail) =="
            if [ "$PROBE_BROWSER" = "true" ]; then
              python -m realestate.cli probe-sites --browser
            else
              python -m realestate.cli probe-sites
            fi
          elif [ -n "$DEBUG_SOURCE" ]; then
            echo "== Modo debug-source: $DEBUG_SOURCE (no se manda mail) =="
            if [ "$DEBUG_RAW_KEYS" = "true" ]; then
              python -m realestate.cli debug-source "$DEBUG_SOURCE" --raw-keys
            else
              python -m realestate.cli debug-source "$DEBUG_SOURCE"
            fi
          elif [ "$DRY_RUN" = "true" ]; then
            echo "== Modo dry-run: no se manda ningún mail =="
            python -m realestate.cli scan --dry-run
          else
            python -m realestate.cli scan
          fi

      - name: Guardar qué avisos ya vimos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_*.json
          git diff --cached --quiet || git commit -m "chore: actualizar avisos ya vistos [skip ci]"
          git push
