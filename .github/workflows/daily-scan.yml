name: Escaneo diario de propiedades

on:
  schedule:
    # 17:00 hora Argentina (UTC-3, sin horario de verano) = 20:00 UTC
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "No mandar mails, sólo mostrar en los logs qué matchearía (recomendado para probar)"
        type: boolean
        default: true
      debug_source:
        description: "Opcional: nombre de una fuente (ej: mercadolibre) para inspeccionar sus datos crudos en vez de correr el scan normal"
        type: string
        default: ""
      debug_raw_keys:
        description: "Junto con debug_source: también mostrar las claves del dato crudo del primer aviso"
        type: boolean
        default: false
      probe_sites:
        description: "Sonda rápida: GET simple a la home de cada sitio, para ver cuáles bloquean el tráfico"
        type: boolean
        default: false
      fetch_url:
        description: "Opcional: URL puntual para inspeccionar su HTML crudo (para desarrollar un conector nuevo)"
        type: string
        default: ""
      fetch_grep:
        description: "Opcional, junto con fetch_url: sólo mostrar líneas que contengan este texto"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -e .

      - name: Correr el scan (o alguna herramienta de diagnóstico)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEBUG_SOURCE: ${{ inputs.debug_source }}
          DEBUG_RAW_KEYS: ${{ inputs.debug_raw_keys }}
          PROBE_SITES: ${{ inputs.probe_sites }}
          FETCH_URL: ${{ inputs.fetch_url }}
          FETCH_GREP: ${{ inputs.fetch_grep }}
        run: |
          if [ -n "$FETCH_URL" ]; then
            echo "== Modo fetch-url: $FETCH_URL (no se manda mail) =="
            python -m realestate.cli fetch-url "$FETCH_URL" --grep "$FETCH_GREP"
          elif [ "$PROBE_SITES" = "true" ]; then
            echo "== Modo probe-sites (no se manda mail) =="
            python -m realestate.cli probe-sites
          elif [ -n "$DEBUG_SOURCE" ]; then
            echo "== Modo debug-source: $DEBUG_SOURCE (no se manda mail) =="
            if [ "$DEBUG_RAW_KEYS" = "true" ]; then
              python -m realestate.cli debug-source "$DEBUG_SOURCE" --raw-keys
            else
              python -m realestate.cli debug-source "$DEBUG_SOURCE"
            fi
          elif [ "$DRY_RUN" = "true" ]; then
            echo "== Modo dry-run: no se manda ningún mail =="
            python -m realestate.cli scan --dry-run
          else
            python -m realestate.cli scan
          fi

      - name: Guardar qué avisos ya vimos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_*.json
          git diff --cached --quiet || git commit -m "chore: actualizar avisos ya vistos [skip ci]"
          git push
