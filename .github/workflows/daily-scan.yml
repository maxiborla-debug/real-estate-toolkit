name: Escaneo diario de propiedades

on:
  schedule:
    # 17:00 hora Argentina (UTC-3, sin horario de verano) = 20:00 UTC
    - cron: "0 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -e .

      - name: Correr el scan y mandar el mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m realestate.cli scan

      - name: Guardar qué avisos ya vimos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_*.json
          git diff --cached --quiet || git commit -m "chore: actualizar avisos ya vistos [skip ci]"
          git push
